name: Gateway container build
on:
  pull_request:
    paths: ['FusionOps.Gateway/**', 'NuGet.Config', 'Directory.Build.props', '.github/workflows/gateway-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f FusionOps.Gateway/Dockerfile -t fusionops-gateway:verify .
